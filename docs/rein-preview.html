<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>黎恩 Rein — 3D 立繪重建</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0d18;color:#cfddf6;font-family:"Noto Sans TC",sans-serif;overflow:hidden;height:100vh}
  #stage{position:absolute;left:0;right:0;top:0;bottom:0}
  #info{position:absolute;left:16px;top:16px;background:rgba(10,14,25,0.85);border:1px solid #4A5A73;border-radius:10px;padding:14px 18px;backdrop-filter:blur(8px);max-width:320px;z-index:5;font-size:12px;line-height:1.7}
  #info h1{font-size:18px;color:#E0A42E;margin-bottom:4px}
  #info .sub{font-size:11px;color:#6FC7E8;letter-spacing:2px;margin-bottom:10px}
  #status{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);background:rgba(10,14,25,0.9);border:1px solid #4A5A73;border-radius:8px;padding:8px 16px;font-size:11px;backdrop-filter:blur(8px);z-index:5;color:#aaa;font-family:monospace}
  #status .ok{color:#66e0b0}
  #controls{position:absolute;right:16px;top:16px;background:rgba(10,14,25,0.85);border:1px solid #4A5A73;border-radius:10px;padding:10px;backdrop-filter:blur(8px);z-index:5;display:flex;flex-direction:column;gap:6px}
  #controls button{background:#3a4358;border:1px solid #4A5A73;color:#cfddf6;padding:5px 10px;border-radius:5px;cursor:pointer;font-family:inherit;font-size:11px}
  #controls button.active{background:#8A5BE0;color:#fff}
  .el-fire{background:#D64E2B!important;color:#fff!important}
  .el-ice{background:#6FC7E8!important;color:#fff!important}
  .el-thunder{background:#8A5BE0!important;color:#fff!important}
</style>
</head>
<body>
<div id="stage"></div>
<div id="info">
  <h1>嵐刃・黎恩 Rein</h1>
  <div class="sub">THE BLADE OF THE STORM</div>
  <p>178cm / 7.5頭身 / 異色瞳（左金右冰藍）/ 右手纏繃帶封印雷元素 / 三相之劍「裂空」</p>
</div>
<div id="controls">
  <button id="btn-spin" class="active">⟳ 自動旋轉</button>
  <button class="el-btn el-fire active" data-el="fire">火</button>
  <button class="el-btn el-ice" data-el="ice">冰</button>
  <button class="el-btn el-thunder" data-el="thunder">雷</button>
</div>
<div id="status">建立中...</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script>
// ============================================================
// 設定稿顏色（嚴格按 docs/design/proportion-sheet.md 與 hero-portrait.png 比對）
// ============================================================
const COL = {
  hair:     0x1F2538,  // 深藍黑
  hairStreak:0xE8F1FF, // 電光白
  skin:     0xEBD3C2,  // 冷白
  coat:     0x4A5A73,  // 暴風灰藍
  coatInner:0x3B2A4E,  // 深紫
  undersuit:0x1B1E24,  // 墨黑
  armor:    0x6E7681,  // 鋼鐵灰
  pauldron: 0x2A2F38,  // 黑鎧（單肩用，較深）
  metal:    0xA9B0BC,  // 古銅銀
  pants:    0x1B1E24,  // 黑長褲
  boots:    0x14171C,  // 戰鬥靴
  fire:     0xD64E2B,
  ice:      0x6FC7E8,
  thunder:  0x8A5BE0,
};

// 7.5頭身比例（178cm / 23.7cm head）— 用 cm 為 scene unit
const H = 23.7;
const TOTAL = 178;

// ============================================================
// 場景
// ============================================================
const stage = document.getElementById('stage');
const W = innerWidth, Hh = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W, Hh);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.4;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1322);

// 相機：正面平視，從稍高的位置俯瞰（讓頭部、肩膀、腿部都看到）
const camera = new THREE.PerspectiveCamera(40, W/Hh, 0.1, 500);
// 角色高度 178cm，放在 (0,0,0)，腳在 y=0
camera.position.set(0, 130, 320);   // 高度 130cm（中段），距離 320cm
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 90, 0);     // 看向角色腰部（90cm 高）
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 200;
controls.maxDistance = 600;

// 光照：3 點照明（暖主光 + 冷補光 + 邊光）
scene.add(new THREE.HemisphereLight(0xa0b0c0, 0x2a3050, 0.5));
const keyLight = new THREE.DirectionalLight(0xfff0d8, 1.4);
keyLight.position.set(80, 180, 100);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.left = -120;
keyLight.shadow.camera.right = 120;
keyLight.shadow.camera.top = 200;
keyLight.shadow.camera.bottom = -20;
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0x88a0c0, 0.5);
fillLight.position.set(-80, 100, -60);
scene.add(fillLight);
const rimLight = new THREE.DirectionalLight(0xc8d8ff, 0.4);
rimLight.position.set(0, 60, -120);
scene.add(rimLight);

// 地面
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(180, 64),
  new THREE.MeshStandardMaterial({ color:0x1a1f2e, roughness:0.9, metalness:0.1 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// 地面裝飾圓（極低不擋視線）
const ringMat = new THREE.MeshStandardMaterial({ color:0x3a4358, emissive:0x2a3050, emissiveIntensity:0.2, roughness:0.7, metalness:0.4 });
[80, 130, 180].forEach((r,i) => {
  const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.5, 8, 64), ringMat);
  ring.rotation.x = Math.PI/2;
  ring.position.y = 0.1 + i*0.1;
  scene.add(ring);
});

// ============================================================
// 黎恩模型
// 重要坐標系：
//   +Y = 上（頭頂）
//   +X = 角色右側（觀看者左側）— 受傷手、單肩鎧
//   +Z = 角色正面（朝向觀看者）
// ============================================================
const rein = new THREE.Group();
rein.userData.parts = {};
scene.add(rein);

function makeMat(color, opts={}) {
  return new THREE.MeshStandardMaterial({
    color,
    roughness: opts.roughness ?? 0.7,
    metalness: opts.metalness ?? 0.1,
    emissive: opts.emissive ?? 0x000000,
    emissiveIntensity: opts.emissiveIntensity ?? 0,
  });
}
function add(mesh, name, parent=rein) {
  mesh.castShadow = true;
  if (parent !== rein) mesh.castShadow = true;
  parent.add(mesh);
  if (parent === rein) rein.userData.parts[name] = mesh;
  return mesh;
}

// ====== 頭 ======
// 臉部（橢圓稍長的頭顱）
const head = new THREE.Mesh(
  new THREE.SphereGeometry(11, 24, 20),
  makeMat(COL.skin, { roughness:0.75 })
);
head.position.set(0, TOTAL - H*0.5, 0);
head.scale.set(0.92, 1.05, 0.95);  // 略修長
add(head, 'head');

// 下巴微凸
const chin = new THREE.Mesh(
  new THREE.SphereGeometry(5, 16, 12),
  makeMat(COL.skin, { roughness:0.75 })
);
chin.position.set(0, TOTAL - H*0.85, 4.5);
add(chin, 'chin');

// 鼻子（小三角）
const nose = new THREE.Mesh(
  new THREE.ConeGeometry(1.2, 4, 6),
  makeMat(COL.skin, { roughness:0.75 })
);
nose.position.set(0, TOTAL - H*0.55, 10.2);
nose.rotation.x = Math.PI/2;
add(nose, 'nose');

// ====== 異色瞳 ======
// 觀看者左側（角色右眼）= 琥珀金 #E0A42E
const eyeR = new THREE.Mesh(
  new THREE.SphereGeometry(1.5, 12, 10),
  makeMat(0xE0A42E, { emissive:0xE0A42E, emissiveIntensity:0.5, roughness:0.2 })
);
eyeR.position.set(-3.5, TOTAL - H*0.55, 9.5);
add(eyeR, 'eyeR');

// 觀看者右側（角色左眼）= 冰藍 #6FC7E8
const eyeL = new THREE.Mesh(
  new THREE.SphereGeometry(1.5, 12, 10),
  makeMat(0x6FC7E8, { emissive:0x6FC7E8, emissiveIntensity:0.5, roughness:0.2 })
);
eyeL.position.set(3.5, TOTAL - H*0.55, 9.5);
add(eyeL, 'eyeL');

// 眼白/眼眶陰影（在臉部前方微凸的橢圓）
const eyeShadeR = new THREE.Mesh(
  new THREE.SphereGeometry(1.7, 12, 10),
  makeMat(0xEBD3C2, { roughness:0.5 })
);
eyeShadeR.position.set(-3.5, TOTAL - H*0.55, 9.7);
add(eyeShadeR, 'eyeShadeR');
const eyeShadeL = eyeShadeR.clone();
eyeShadeL.position.set(3.5, TOTAL - H*0.55, 9.7);
add(eyeShadeL, 'eyeShadeL');

// 眉毛（兩條短橫）
const browR = new THREE.Mesh(
  new THREE.BoxGeometry(3, 0.5, 0.4),
  makeMat(0x1F2538, { roughness:0.8 })
);
browR.position.set(-3.5, TOTAL - H*0.43, 10);
browR.rotation.z = -0.1;
add(browR, 'browR');
const browL = browR.clone();
browL.position.set(3.5, TOTAL - H*0.43, 10);
browL.rotation.z = 0.1;
add(browL, 'browL');

// ====== 頭髮（短髮，凌亂造型 — 對應立繪） ======
// 整體短髮外殼（slightly 大於頭部，覆蓋上 + 後）
const hairShell = new THREE.Mesh(
  new THREE.SphereGeometry(12.5, 28, 22),
  makeMat(COL.hair, { roughness:0.9 })
);
hairShell.position.set(0, TOTAL - H*0.45, -0.5);
hairShell.scale.set(1.05, 1.0, 1.05);
// 頭頂到下巴不遮（cut sphere top + 底部）
add(hairShell, 'hairShell');

// 瀏海（前額往前垂落的短髮塊）
const bangsFrontal = new THREE.Mesh(
  new THREE.BoxGeometry(14, 6, 3),
  makeMat(COL.hair, { roughness:0.9 })
);
bangsFrontal.position.set(0, TOTAL - H*0.35, 10);
bangsFrontal.rotation.x = -0.2;
add(bangsFrontal, 'bangsFrontal');

// 右側蓬鬆髮塊（立繪右側頭髮翹起）
const hairRightSide = new THREE.Mesh(
  new THREE.SphereGeometry(8, 14, 10),
  makeMat(COL.hair, { roughness:0.9 })
);
hairRightSide.position.set(-11, TOTAL - H*0.4, 0);
hairRightSide.scale.set(1.2, 1.0, 1.0);
add(hairRightSide, 'hairRightSide');

// 左側蓬鬆髮塊（立繪左側頭髮翹起）
const hairLeftSide = new THREE.Mesh(
  new THREE.SphereGeometry(7, 14, 10),
  makeMat(COL.hair, { roughness:0.9 })
);
hairLeftSide.position.set(10, TOTAL - H*0.4, -1);
hairLeftSide.scale.set(1.0, 1.0, 1.0);
add(hairLeftSide, 'hairLeftSide');

// 後腦短髮（向後突出，不及頸）
const hairBack = new THREE.Mesh(
  new THREE.SphereGeometry(11, 16, 12, 0, Math.PI*2, 0, Math.PI*0.5),
  makeMat(COL.hair, { roughness:0.9 })
);
hairBack.position.set(0, TOTAL - H*0.5, -4);
add(hairBack, 'hairBack');

// **挑染電光白一撮**（立繪左上方大塊白斑）
const streak = new THREE.Mesh(
  new THREE.SphereGeometry(5, 12, 10),
  makeMat(COL.hairStreak, { roughness:0.7, emissive:COL.hairStreak, emissiveIntensity:0.3 })
);
streak.position.set(7, TOTAL - H*0.35, 8);  // 左上方
streak.scale.set(1.3, 1.0, 0.7);
add(streak, 'streak');

// 立繪左耳上方還有一小撮白色挑染
const streak2 = new THREE.Mesh(
  new THREE.SphereGeometry(3, 10, 8),
  makeMat(COL.hairStreak, { roughness:0.7, emissive:COL.hairStreak, emissiveIntensity:0.2 })
);
streak2.position.set(9, TOTAL - H*0.45, 5);
add(streak2, 'streak2');

// ====== 左耳電光石耳墜 ======
// 立繪中耳墜在觀看者右側 = 角色左耳 = +X
const earRing = new THREE.Group();
earRing.position.set(11, TOTAL - H*0.7, 1);
const earringGem = new THREE.Mesh(
  new THREE.OctahedronGeometry(2.5),
  makeMat(0xC8A8FF, { emissive:0xC8A8FF, emissiveIntensity:1.0, roughness:0.1, metalness:0.7 })
);
earringGem.position.set(0, -5, 0);
earRing.add(earringGem);
const earringChain = new THREE.Mesh(
  new THREE.CylinderGeometry(0.3, 0.3, 3, 8),
  makeMat(COL.metal, { metalness:0.9, roughness:0.2 })
);
earringChain.position.set(0, -1.5, 0);
earRing.add(earringChain);
add(earRing, 'earRing');

// ====== 頸部 ======
const neck = new THREE.Mesh(
  new THREE.CylinderGeometry(4.5, 5, 8, 16),
  makeMat(COL.skin, { roughness:0.75 })
);
neck.position.set(0, TOTAL - H*1.4, 0);
add(neck, 'neck');

// ====== 高領緊身衣（黑色立領） ======
// 立領
const collar = new THREE.Mesh(
  new THREE.CylinderGeometry(5.5, 6, 6, 16),
  makeMat(COL.undersuit, { roughness:0.55 })
);
collar.position.set(0, TOTAL - H*1.65, 0);
add(collar, 'collar');

// 內層緊身衣上半身（窄身）
const undersuit = new THREE.Mesh(
  new THREE.CylinderGeometry(7.5, 9, 26, 16),
  makeMat(COL.undersuit, { roughness:0.55 })
);
undersuit.position.set(0, TOTAL - H*3.4, 0);
add(undersuit, 'undersuit');

// ====== 短打護胸甲（深灰色胸口金屬板） ======
const chestArmor = new THREE.Mesh(
  new THREE.BoxGeometry(20, 22, 6),
  makeMat(COL.armor, { roughness:0.4, metalness:0.7 })
);
chestArmor.position.set(0, TOTAL - H*2.9, 4);
add(chestArmor, 'chestArmor');

// 護胸甲稜線（中央 + 邊框）
const armorEdge1 = new THREE.Mesh(
  new THREE.BoxGeometry(22, 1, 7),
  makeMat(COL.metal, { metalness:0.85, roughness:0.25 })
);
armorEdge1.position.set(0, TOTAL - H*1.95, 4.5);
add(armorEdge1, 'armorEdge1');
const armorEdge2 = new THREE.Mesh(
  new THREE.BoxGeometry(1, 22, 7),
  makeMat(COL.metal, { metalness:0.85, roughness:0.25 })
);
armorEdge2.position.set(0, TOTAL - H*2.9, 4.5);
add(armorEdge2, 'armorEdge2');

// ====== 暴風灰藍長風衣（內襯深紫） ======
// 風衣外殼（左右兩片敞開，露出內層）
const coatLeftFront = new THREE.Mesh(
  new THREE.BoxGeometry(13, 75, 4),
  makeMat(COL.coat, { roughness:0.75, side:THREE.DoubleSide })
);
coatLeftFront.position.set(-10, TOTAL - H*6.8, 5);
coatLeftFront.rotation.z = 0.05;
add(coatLeftFront, 'coatLeftFront');

const coatRightFront = new THREE.Mesh(
  new THREE.BoxGeometry(13, 75, 4),
  makeMat(COL.coat, { roughness:0.75, side:THREE.DoubleSide })
);
coatRightFront.position.set(10, TOTAL - H*6.8, 5);
coatRightFront.rotation.z = -0.05;
add(coatRightFront, 'coatRightFront');

// 風衣後片（連續的大片）
const coatBack = new THREE.Mesh(
  new THREE.BoxGeometry(26, 80, 5),
  makeMat(COL.coat, { roughness:0.75, side:THREE.DoubleSide })
);
coatBack.position.set(0, TOTAL - H*6.8, -2);
add(coatBack, 'coatBack');

// 風衣內襯（深紫，在敞開處可見）
const coatInner = new THREE.Mesh(
  new THREE.BoxGeometry(16, 70, 1),
  makeMat(COL.coatInner, { roughness:0.6, side:THREE.DoubleSide })
);
coatInner.position.set(0, TOTAL - H*7.0, 7.5);
add(coatInner, 'coatInner');

// 風衣下擺外展（呈喇叭狀）
const coatSkirt = new THREE.Mesh(
  new THREE.CylinderGeometry(28, 18, 25, 16, 1, true),
  makeMat(COL.coat, { roughness:0.75, side:THREE.DoubleSide })
);
coatSkirt.position.set(0, TOTAL - H*8.0, 0);
add(coatSkirt, 'coatSkirt');

// 風衣下擺內側（深紫）
const coatSkirtInner = new THREE.Mesh(
  new THREE.CylinderGeometry(26, 16, 23, 16, 1, true),
  makeMat(COL.coatInner, { roughness:0.6, side:THREE.BackSide })
);
coatSkirtInner.position.set(0, TOTAL - H*8.0, 0);
add(coatSkirtInner, 'coatSkirtInner');

// 翻領（高至下巴的兩片翻領）
const lapelLeft = new THREE.Mesh(
  new THREE.BoxGeometry(7, 18, 2),
  makeMat(COL.coat, { roughness:0.75 })
);
lapelLeft.position.set(-7, TOTAL - H*1.7, 7);
lapelLeft.rotation.z = 0.15;
add(lapelLeft, 'lapelLeft');
const lapelRight = lapelLeft.clone();
lapelRight.position.set(7, TOTAL - H*1.7, 7);
lapelRight.rotation.z = -0.15;
add(lapelRight, 'lapelRight');

// 內襯深紫翻領內側
const lapelInnerLeft = new THREE.Mesh(
  new THREE.BoxGeometry(5, 17, 1),
  makeMat(COL.coatInner, { roughness:0.6 })
);
lapelInnerLeft.position.set(-8, TOTAL - H*1.7, 8);
lapelInnerLeft.rotation.z = 0.15;
add(lapelInnerLeft, 'lapelInnerLeft');
const lapelInnerRight = lapelInnerLeft.clone();
lapelInnerRight.position.set(8, TOTAL - H*1.7, 8);
lapelInnerRight.rotation.z = -0.15;
add(lapelInnerRight, 'lapelInnerRight');

// ====== 單肩鎧（右肩，觀看者左側，-X） ======
const pauldronGroup = new THREE.Group();
pauldronGroup.position.set(-14, TOTAL - H*2.2, 1);

// 主鎧（大型弧面甲片）
const pauldronMain = new THREE.Mesh(
  new THREE.SphereGeometry(11, 18, 14, 0, Math.PI*2, 0, Math.PI*0.55),
  makeMat(COL.pauldron, { roughness:0.3, metalness:0.8 })
);
pauldronGroup.add(pauldronMain);

// 鎧甲延伸片（覆蓋至上臂）
const pauldronSide = new THREE.Mesh(
  new THREE.BoxGeometry(8, 14, 8),
  makeMat(COL.pauldron, { roughness:0.3, metalness:0.8 })
);
pauldronSide.position.set(-3, -6, 0);
pauldronSide.rotation.z = -0.2;
pauldronGroup.add(pauldronSide);

// 金屬護邊（外側裝飾）
const pauldronRim = new THREE.Mesh(
  new THREE.TorusGeometry(10.5, 0.6, 8, 24, Math.PI*1.1),
  makeMat(COL.metal, { metalness:0.95, roughness:0.15 })
);
pauldronRim.rotation.x = -Math.PI/2;
pauldronRim.rotation.z = -Math.PI*0.35;
pauldronGroup.add(pauldronRim);

// 鎧尖（向上翹起的金屬尖）
const pauldronSpike = new THREE.Mesh(
  new THREE.ConeGeometry(2.5, 7, 8),
  makeMat(COL.metal, { metalness:0.95, roughness:0.15 })
);
pauldronSpike.position.set(-6, 6, -1);
pauldronSpike.rotation.z = 0.3;
pauldronGroup.add(pauldronSpike);
add(pauldronGroup, 'pauldron');

// ====== 雙臂 ======
// 右臂（角色右臂 = 觀看者左側，-X）— 纏繃帶封印雷元素
const rightArmGroup = new THREE.Group();
rightArmGroup.position.set(-10, TOTAL - H*3.0, 4);
const rightUpperArm = new THREE.Mesh(
  new THREE.CylinderGeometry(4.5, 4, 14, 12),
  makeMat(COL.undersuit, { roughness:0.6 })
);
rightUpperArm.position.y = -7;
rightArmGroup.add(rightUpperArm);

// 右前臂（外露的繃帶 — 米白色多層纏繞）
const bandageMat = makeMat(0xF0E8D8, { roughness:0.85 });
// 繃帶主體
const rightForearm = new THREE.Mesh(
  new THREE.CylinderGeometry(4, 3.5, 16, 12),
  bandageMat
);
rightForearm.position.y = -22;
rightArmGroup.add(rightForearm);
// 繃帶環繞（多層 Torus 環）
for (let i=0; i<7; i++){
  const wrap = new THREE.Mesh(
    new THREE.TorusGeometry(4, 0.6, 8, 20),
    bandageMat
  );
  wrap.position.y = -15 - i*2.5;
  wrap.rotation.x = Math.PI/2;
  rightArmGroup.add(wrap);
}
// 繃帶末端垂落的布條
const bandageStrip = new THREE.Mesh(
  new THREE.BoxGeometry(2, 8, 1),
  bandageMat
);
bandageStrip.position.set(0, -32, 2);
bandageStrip.rotation.x = -0.3;
rightArmGroup.add(bandageStrip);
add(rightArmGroup, 'rightArm');

// 左臂（角色左臂 = 觀看者右側，+X）— 持劍
const leftArmGroup = new THREE.Group();
leftArmGroup.position.set(10, TOTAL - H*3.0, 4);
const leftUpperArm = new THREE.Mesh(
  new THREE.CylinderGeometry(4.5, 4, 14, 12),
  makeMat(COL.undersuit, { roughness:0.6 })

// ============================================================
// 元素切換
// ============================================================
let currentElement = 'fire';
function setElement(el) {
  currentElement = el;
  const crystals = rein.userData.crystals;
  [crystals.fire, crystals.ice, crystals.thunder].forEach(c => c.material.emissiveIntensity = 0.8);
  crystals[el].material.emissiveIntensity = 4.0;
  document.querySelectorAll('.el-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-el="${el}"]`)?.classList.add('active');
}

document.querySelectorAll('.el-btn').forEach(b => {
  b.addEventListener('click', () => setElement(b.dataset.el));
});

// ============================================================
// 動畫
// ============================================================
let autoRotate = true;
let animT = 0;
document.getElementById('btn-spin').addEventListener('click', () => {
  autoRotate = !autoRotate;
  document.getElementById('btn-spin').classList.toggle('active', autoRotate);
});

// ============================================================
// 主循環
// ============================================================
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  animT += dt;

  // 自動旋轉
  if (autoRotate) {
    rein.rotation.y += dt * 0.3;
  }

  // 待機呼吸
  const breathe = Math.sin(animT * 1.8) * 0.3;
  rein.position.y = breathe;

  // 水晶脈動
  const crystals = rein.userData.crystals;
  [crystals.fire, crystals.ice, crystals.thunder].forEach((c, i) => {
    c.scale.setScalar(1 + 0.1 * Math.sin(animT*4 + i));
  });

  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// 初始化
setElement('fire');
document.getElementById('status').innerHTML = '<span class="ok">✓ 黎恩模型已建立（嚴格按 hero-portrait.png 重建）</span>';
animate();
