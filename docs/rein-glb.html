<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>黎恩·舒華澤 — 程序化角色模型展示（第一性原則）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080c18;color:#c8d8f0;font-family:'Segoe UI',sans-serif;overflow:hidden}
#stage{width:100vw;height:100vh;display:block}
#controls{position:absolute;left:16px;top:120px;background:rgba(10,14,25,0.88);border:1px solid #3a4a6a;border-radius:10px;padding:12px;backdrop-filter:blur(8px);z-index:5;width:220px;font-size:11px}
#controls h3{margin-bottom:8px;color:#E0A42E;font-size:13px}
label{display:flex;align-items:center;justify-content:space-between;margin:5px 0;gap:6px}
label input[type=range]{flex:1;accent-color:#E0A42E}
.btn-row{display:flex;gap:6px;margin-top:8px}
button{background:#1a2040;border:1px solid #3a4a6a;color:#c8d8f0;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:11px;transition:all .15s}
button:hover{background:#2a3060}
button.active{background:#E0A42E;color:#0a0e1a;border-color:#E0A42E;font-weight:bold}
.el-btn{min-width:32px;text-align:center}
#status{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#6878a0;z-index:5;pointer-events:none}
</style>
</head>
<body>

<div id="stage"></div>

<div id="controls">
  <h3>⚙ 變形參數</h3>
  <label>頭部放大 <input id="s-head" type="range" min="1.0" max="1.5" step="0.01" value="1.20"></label>
  <label>軀幹拉長 <input id="s-spine" type="range" min="1.0" max="1.3" step="0.01" value="1.12"></label>
  <label>腿部拉長 <input id="s-leg" type="range" min="1.0" max="1.4" step="0.01" value="1.15"></label>
  <label>腰收縮 <input id="s-waist" type="range" min="0.80" max="1.0" step="0.01" value="0.88"></label>
  <div class="btn-row">
    <button id="btn-spin" class="active">⟳ 旋轉</button>
  </div>
  <div class="btn-row">
    <button class="el-btn active" data-el="fire" style="background:#8B2010;border-color:#E05020">火</button>
    <button class="el-btn" data-el="ice" style="background:#104080;border-color:#40D0FF">冰</button>
    <button class="el-btn" data-el="thunder" style="background:#301080;border-color:#9050F0">雷</button>
  </div>
</div>

<div id="status">構建中...</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>

<script>
// ============================================================
//  第一性原則：完全不依賴 GLB，純程序化幾何構建黎恩角色
//  每個部位獨立 Mesh，顏色、材質、位置完全可控
// ============================================================

const C = {
  // 高飽和度配色 —— 每個顏色在渲染中都有極大差異，確保視覺上清晰可辨
  skin:      0xFFB878,   // 明亮桃膚
  hair:      0x111122,   // 深黑
  hairStreak:0xFFDD88,   // 金白挑染
  coat:      0x1166EE,   // 鮮明寶藍
  coatInner: 0x0833AA,   // 深藍內襯
  undersuit: 0x080A18,   // 深黑內衣
  armor:     0x3388FF,   // 亮藍鎧甲
  metal:     0xFFBB22,   // 鮮明金色
  metalDark: 0x886622,   // 暗金
  pants:     0x0A1020,   // 深藍褲
  boots:     0x080C15,   // 黑靴
  bandage:   0xFFFFF0,   // 純白繃帶
  pauldron:  0x1A2244,   // 深藍肩甲
  eyeGold:   0xFFCC00,   // 金瞳
  eyeBlue:   0x00CCFF,   // 藍瞳
  fire:      0xFF3300,
  ice:       0x00EEFF,
  thunder:   0xAA00FF,
};

// ---- Renderer & Scene ----
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
// 使用 LinearToneMapping 確保顏色不被壓縮——每種顏色都保持原始飽和度
renderer.toneMapping = THREE.NoToneMapping;
renderer.toneMappingExposure = 1.2;
renderer.outputEncoding = THREE.sRGBEncoding;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x101830);
scene.fog = new THREE.Fog(0x080c18, 20, 50);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 2.0, 5.0);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 2.5;
controls.maxDistance = 12;

// ---- Lighting: 鮮明配色需要充足光線 ----
scene.add(new THREE.HemisphereLight(0x8090cc, 0x201830, 1.0));
const key = new THREE.DirectionalLight(0xfff8e0, 3.5);
key.position.set(4, 6, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
scene.add(key);
const fill = new THREE.DirectionalLight(0x90a0d0, 0.8);
fill.position.set(-4, 4, -2);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xb0c8ff, 0.7);
rim.position.set(0, 5, -6);
scene.add(rim);

// ---- Ground ----
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(4, 64),
  new THREE.MeshStandardMaterial({ color: 0x0e1420, roughness: 0.9, metalness: 0.05 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);
[1.2, 2.0, 2.8].forEach((r,i) => {
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(r, 0.02, 8, 64),
    new THREE.MeshStandardMaterial({ color:0x2a3050, emissive:0x1a2040, emissiveIntensity:0.4, roughness:0.6, metalness:0.5 })
  );
  ring.rotation.x = -Math.PI/2;
  ring.position.y = 0.005 + i*0.004;
  scene.add(ring);
});

// ---- Build Rein procedurally ----
const character = new THREE.Group();
character.name = 'Rein_Procedural';

function mat(color, opts = {}) {
  return new THREE.MeshStandardMaterial({ color, roughness: 0.7, metalness: 0.0, ...opts });
}
function mesh(geo, material, pos, rot, scale) {
  const m = new THREE.Mesh(geo, material);
  if (pos) m.position.set(pos[0], pos[1], pos[2]);
  if (rot) m.rotation.set(rot[0], rot[1], rot[2]);
  if (scale) m.scale.set(scale[0], scale[1], scale[2]);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

// === BODY SCALE PARAMS ===
let bodyScale = { head: 1.20, spine: 1.12, leg: 1.15, waist: 0.88 };

// --- LEGS ---
const legMat = mat(C.pants);
const bootMat = mat(C.boots);
[-1, 1].forEach(side => {
  // Upper leg (thigh)
  character.add(mesh(
    new THREE.CylinderGeometry(0.09, 0.075, 0.48, 12),
    legMat,
    [side * 0.13, 0.52, 0]
  ));
  // Lower leg (calf)
  character.add(mesh(
    new THREE.CylinderGeometry(0.075, 0.065, 0.46, 12),
    legMat,
    [side * 0.13, 0.06, 0]
  ));
  // Boot
  character.add(mesh(
    new THREE.BoxGeometry(0.14, 0.10, 0.20),
    bootMat,
    [side * 0.13, -0.10, 0.02]
  ));
  // Boot tip
  character.add(mesh(
    new THREE.BoxGeometry(0.15, 0.04, 0.22),
    mat(0x10141E),
    [side * 0.13, -0.16, 0.03]
  ));
});

// --- TORSO ---
const coatMat = mat(C.coat, { side: THREE.DoubleSide });
const innerMat = mat(C.coatInner);
const armorMat = mat(C.armor, { metalness: 0.6, roughness: 0.35 });
const metalMat = mat(C.metal, { metalness: 0.9, roughness: 0.15 });
const undersuitMat = mat(C.undersuit);

// Torso main (coat body)
character.add(mesh(
  new THREE.CylinderGeometry(0.16, 0.14, 0.55, 12),
  coatMat,
  [0, 1.18, 0]
));
// Inner coat (visible at chest opening)
character.add(mesh(
  new THREE.CylinderGeometry(0.10, 0.09, 0.35, 12),
  innerMat,
  [0, 1.25, 0.06]
));
// Chest armor plate
character.add(mesh(
  new THREE.BoxGeometry(0.28, 0.30, 0.06),
  armorMat,
  [0, 1.30, 0.12]
));
// Armor gold trim (horizontal line)
character.add(mesh(
  new THREE.BoxGeometry(0.29, 0.008, 0.065),
  metalMat,
  [0, 1.38, 0.13]
));
character.add(mesh(
  new THREE.BoxGeometry(0.29, 0.008, 0.065),
  metalMat,
  [0, 1.22, 0.13]
));
// Vertical armor center line
character.add(mesh(
  new THREE.BoxGeometry(0.008, 0.30, 0.065),
  metalMat,
  [0, 1.30, 0.13]
));

// --- COAT TAIL (back) ---
character.add(mesh(
  new THREE.BoxGeometry(0.34, 0.70, 0.04),
  coatMat,
  [0, 0.78, -0.10]
));
// Coat skirt (front panels)
character.add(mesh(
  new THREE.BoxGeometry(0.16, 0.55, 0.04),
  coatMat,
  [-0.09, 0.82, 0.10]
));
character.add(mesh(
  new THREE.BoxGeometry(0.16, 0.55, 0.04),
  coatMat,
  [0.09, 0.82, 0.10]
));
// Coat inner lining (visible at skirt edges)
character.add(mesh(
  new THREE.BoxGeometry(0.14, 0.50, 0.02),
  innerMat,
  [-0.09, 0.82, 0.13]
));
character.add(mesh(
  new THREE.BoxGeometry(0.14, 0.50, 0.02),
  innerMat,
  [0.09, 0.82, 0.13]
));

// --- SHOULDERS / PAULDRON ---
[-1, 1].forEach(side => {
  // Shoulder pad
  character.add(mesh(
    new THREE.SphereGeometry(0.13, 16, 12, 0, Math.PI*2, 0, Math.PI*0.5),
    mat(C.pauldron, { metalness: 0.5, roughness: 0.3 }),
    [side * 0.22, 1.50, 0]
  ));
  // Metal rim on pauldron
  character.add(mesh(
    new THREE.TorusGeometry(0.12, 0.012, 8, 24, Math.PI * 1.2),
    metalMat,
    [side * 0.22, 1.50, 0],
    [Math.PI/2, 0, 0]
  ));
  // Spike on pauldron
  character.add(mesh(
    new THREE.ConeGeometry(0.025, 0.12, 6),
    metalMat,
    [side * (0.22 + 0.08), 1.58, 0]
  ));
});

// --- ARMS ---
[-1, 1].forEach(side => {
  // Upper arm
  character.add(mesh(
    new THREE.CylinderGeometry(0.05, 0.045, 0.28, 10),
    mat(C.undersuit),
    [side * 0.24, 1.28, 0]
  ));
  // Forearm (coat sleeve)
  character.add(mesh(
    new THREE.CylinderGeometry(0.055, 0.048, 0.26, 10),
    coatMat,
    [side * 0.25, 1.00, 0]
  ));
  // Hand (skin)
  character.add(mesh(
    new THREE.SphereGeometry(0.04, 10, 8),
    mat(C.skin, { roughness: 0.6 }),
    [side * 0.25, 0.84, 0]
  ));
});

// --- NECK & HEAD ---
// Neck
character.add(mesh(
  new THREE.CylinderGeometry(0.05, 0.06, 0.10, 10),
  mat(C.skin, { roughness: 0.6 }),
  [0, 1.58, 0]
));

// Head (face)
const headGroup = new THREE.Group();
headGroup.position.set(0, 1.72, 0);
headGroup.scale.set(bodyScale.head, bodyScale.head, bodyScale.head);

// Main head shape (slightly elongated oval)
character.add(mesh(
  new THREE.SphereGeometry(0.13, 20, 16),
  mat(C.skin, { roughness: 0.55 }),
  [0, 0, 0]
));

// Hair base (short black hair, covers top and back of head)
character.add(mesh(
  new THREE.SphereGeometry(0.135, 20, 16, 0, Math.PI*2, 0, Math.PI*0.6),
  mat(C.hair, { roughness: 0.9 }),
  [0, 0.01, -0.01]
));

// Front bangs
character.add(mesh(
  new THREE.BoxGeometry(0.20, 0.06, 0.06),
  mat(C.hair),
  [0, 0.08, 0.10]
));
// Side bangs
[-1, 1].forEach(side => {
  character.add(mesh(
    new THREE.BoxGeometry(0.04, 0.10, 0.06),
    mat(C.hair),
    [side * 0.11, 0.04, 0.08]
  ));
});

// Silver streak (signature white streak in hair)
character.add(mesh(
  new THREE.SphereGeometry(0.055, 12, 10),
  mat(C.hairStreak, { emissive: C.hairStreak, emissiveIntensity: 0.3 }),
  [0.06, 0.10, 0.06]
));
character.add(mesh(
  new THREE.SphereGeometry(0.04, 10, 8),
  mat(C.hairStreak, { emissive: C.hairStreak, emissiveIntensity: 0.3 }),
  [-0.05, 0.08, 0.07]
));

// Eyes (heterochromia: gold right, blue left)
[-1, 1].forEach(side => {
  // Eye socket
  character.add(mesh(
    new THREE.SphereGeometry(0.022, 10, 8),
    mat(side === 1 ? C.eyeGold : C.eyeBlue, { emissive: side === 1 ? C.eyeGold : C.eyeBlue, emissiveIntensity: 0.6, roughness: 0.1 }),
    [side * 0.06, 0.01, 0.11]
  ));
  // Eyebrow
  character.add(mesh(
    new THREE.BoxGeometry(0.05, 0.006, 0.006),
    mat(C.hair),
    [side * 0.06, 0.04, 0.115]
  ));
});

// Nose (subtle)
character.add(mesh(
  new THREE.ConeGeometry(0.012, 0.025, 6),
  mat(C.skin, { roughness: 0.6 }),
  [0, -0.01, 0.13]
));

// Mouth (small line)
character.add(mesh(
  new THREE.BoxGeometry(0.04, 0.005, 0.005),
  mat(0x8B4040),
  [0, -0.05, 0.125]
));

// Earring (left side, silver chain with gem)
character.add(mesh(
  new THREE.OctahedronGeometry(0.025, 0),
  mat(0xC8A8FF, { emissive: 0xC8A8FF, emissiveIntensity: 1.0, roughness: 0.1, metalness: 0.7 }),
  [-0.13, -0.02, 0.02]
));
// Chain
for (let i = 0; i < 5; i++) {
  character.add(mesh(
    new THREE.SphereGeometry(0.004, 6, 6),
    metalMat,
    [-0.13, -0.04 - i*0.018, 0.01]
  ));
}

character.add(headGroup);

// --- BELT ---
character.add(mesh(
  new THREE.TorusGeometry(0.15, 0.018, 8, 24),
  mat(0x10141E, { metalness: 0.3, roughness: 0.5 }),
  [0, 0.92, 0]
));
// Belt buckle
character.add(mesh(
  new THREE.BoxGeometry(0.07, 0.05, 0.02),
  metalMat,
  [0, 0.92, 0.15]
));

// --- SCARF / COLLAR ---
character.add(mesh(
  new THREE.CylinderGeometry(0.08, 0.10, 0.08, 12),
  mat(C.undersuit),
  [0, 1.55, 0]
));

// --- RIGHT FOREARM: BANDAGE WRAP ---
const bandageMat = mat(C.bandage, { roughness: 0.85 });
character.add(mesh(
  new THREE.CylinderGeometry(0.065, 0.055, 0.28, 10),
  bandageMat,
  [0.25, 1.00, 0]
));
for (let i = 0; i < 6; i++) {
  character.add(mesh(
    new THREE.TorusGeometry(0.066, 0.008, 4, 12),
    bandageMat,
    [0.25, 0.88 + i*0.04, 0]
  ));
}

// --- RIGHT HAND: THREE ELEMENT CRYSTALS + SWORD ---
const crystalGroup = new THREE.Group();
crystalGroup.position.set(0.25, 0.78, 0);

const crystals = {
  fire:    new THREE.Mesh(new THREE.OctahedronGeometry(0.03, 0), mat(C.fire, { emissive: C.fire, emissiveIntensity: 2.5 })),
  ice:     new THREE.Mesh(new THREE.OctahedronGeometry(0.03, 0), mat(C.ice, { emissive: C.ice, emissiveIntensity: 2.5 })),
  thunder: new THREE.Mesh(new THREE.OctahedronGeometry(0.03, 0), mat(C.thunder, { emissive: C.thunder, emissiveIntensity: 2.5 })),
};
crystals.fire.position.set(-0.04, 0.06, 0);
crystals.ice.position.set(0.04, 0.06, 0);
crystals.thunder.position.set(0, 0.12, 0);
crystalGroup.add(crystals.fire, crystals.ice, crystals.thunder);

// Sword (Soul of Kaiza / 裂空)
const swordGroup = new THREE.Group();
swordGroup.position.set(0.30, 0.60, 0.08);
swordGroup.rotation.z = 0.15;

// Blade
const bladeLen = 0.70;
swordGroup.add(mesh(
  new THREE.BoxGeometry(0.035, bladeLen, 0.008),
  mat(0xD8DCE8, { metalness: 0.95, roughness: 0.1 }),
  [0, bladeLen/2, 0]
));
// Crossguard
swordGroup.add(mesh(
  new THREE.BoxGeometry(0.16, 0.025, 0.035),
  metalMat,
  [0, 0, 0]
));
// Grip
swordGroup.add(mesh(
  new THREE.CylinderGeometry(0.018, 0.018, 0.14, 8),
  mat(0x1A1008, { roughness: 0.8 }),
  [0, -0.09, 0]
));
// Pommel
swordGroup.add(mesh(
  new THREE.SphereGeometry(0.025, 8, 8),
  metalMat,
  [0, -0.18, 0]
));

crystalGroup.add(swordGroup);
character.add(crystalGroup);

// --- LEFT SHOULDER: CAPE CLASP ---
const capeGroup = new THREE.Group();
capeGroup.position.set(-0.18, 1.48, -0.05);
capeGroup.add(mesh(
  new THREE.TorusGeometry(0.04, 0.008, 8, 16),
  metalMat,
  [0, 0, 0]
));
for (let i = 0; i < 3; i++) {
  capeGroup.add(mesh(
    new THREE.BoxGeometry(0.012, 0.16, 0.012),
    mat(C.coatInner),
    [(i-1)*0.018, -0.10, 0.01]
  ));
}
// Cape fabric
character.add(mesh(
  new THREE.PlaneGeometry(0.50, 0.80),
  coatMat,
  [-0.18, 1.10, -0.15],
  [0, 0.15, 0]
));
character.add(capeGroup);

// Position character
character.position.set(0, 0, 0);
scene.add(character);

// Store refs
const accessoryCrys = { fire: crystals.fire, ice: crystals.ice, thunder: crystals.thunder };
let currentElement = 'fire';
let autoRotate = true;

// ---- Element switch ----
function setElement(el) {
  currentElement = el;
  [accessoryCrys.fire, accessoryCrys.ice, accessoryCrys.thunder].forEach(c => {
    if (c && c.material) c.material.emissiveIntensity = 0.6;
  });
  if (accessoryCrys[el] && accessoryCrys[el].material) {
    accessoryCrys[el].material.emissiveIntensity = 4.0;
  }
}
document.querySelectorAll('.el-btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.el-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    setElement(b.dataset.el);
  });
});

// ---- Deform params ----
const sHead = document.getElementById('s-head');
const sSpine = document.getElementById('s-spine');
const sLeg  = document.getElementById('s-leg');
const sWaist= document.getElementById('s-waist');
const deformParams = { head:1.20, spine:1.12, leg:1.15, waist:0.88 };

function applyDeform() {
  // 比例變形：整個 character scale（基礎縮放 1.2 確保角色夠大且比例正常）
  const BASE = 1.2;
  const s = deformParams;
  character.scale.set(
    (0.90 + (1-s.waist)*0.2) * BASE,
    (s.leg * 0.92 + s.spine * 0.08) * BASE,
    (0.90 + (1-s.waist)*0.2) * BASE
  );
  // Head scale override
  const headMesh = character.children.find(c => c.isGroup && c !== crystalGroup && c !== capeGroup);
  if (headMesh) {
    headMesh.scale.set(s.head, s.head, s.head);
  }
}
[sHead, sSpine, sLeg, sWaist].forEach(el => {
  el.addEventListener('input', () => {
    deformParams.head = parseFloat(sHead.value);
    deformParams.spine = parseFloat(sSpine.value);
    deformParams.leg = parseFloat(sLeg.value);
    deformParams.waist = parseFloat(sWaist.value);
    applyDeform();
  });
});
applyDeform();

// ---- Spin toggle ----
document.getElementById('btn-spin').addEventListener('click', function() {
  autoRotate = !autoRotate;
  this.classList.toggle('active', autoRotate);
});

// ---- Status ----
document.getElementById('status').textContent =
  `✓ 程序化渲染成功 — 純幾何構建 / 無 GLB / ${character.children.length} 部件 / 黎恩配色已套用`;

// ---- Animate ----
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  if (autoRotate) character.rotation.y += dt * 0.35;
  controls.update();
  renderer.render(scene, camera);
}
animate();

// ---- Resize ----
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
