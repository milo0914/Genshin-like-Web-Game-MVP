<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>黎恩 Rein — GLB 真實 3D 模型</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0d18;color:#cfddf6;font-family:"Noto Sans TC",sans-serif;overflow:hidden;height:100vh}
  #stage{position:absolute;left:0;right:0;top:0;bottom:0}
  #info{position:absolute;left:16px;top:16px;background:rgba(10,14,25,0.85);border:1px solid #4A5A73;border-radius:10px;padding:14px 18px;backdrop-filter:blur(8px);max-width:340px;z-index:5;font-size:12px;line-height:1.7}
  #info h1{font-size:18px;color:#E0A42E;margin-bottom:4px}
  #info .sub{font-size:11px;color:#6FC7E8;letter-spacing:2px;margin-bottom:10px}
  #info code{background:#1a1e2e;padding:1px 4px;border-radius:3px;color:#ffd97e;font-family:monospace;font-size:11px}
  #info .warn{color:#e0a050;font-size:11px;margin-top:8px}
  #controls{position:absolute;right:16px;top:16px;background:rgba(10,14,25,0.85);border:1px solid #4A5A73;border-radius:10px;padding:10px;backdrop-filter:blur(8px);z-index:5;display:flex;flex-direction:column;gap:6px}
  #controls button{background:#3a4358;border:1px solid #4A5A73;color:#cfddf6;padding:6px 12px;border-radius:5px;cursor:pointer;font-family:inherit;font-size:11px}
  #controls button.active{background:#8A5BE0;color:#fff;border-color:#8A5BE0}
  .el-fire{background:#D64E2B!important;color:#fff!important}
  .el-ice{background:#6FC7E8!important;color:#fff!important}
  .el-thunder{background:#8A5BE0!important;color:#fff!important}
  #status{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);background:rgba(10,14,25,0.9);border:1px solid #4A5A73;border-radius:8px;padding:8px 16px;font-size:11px;backdrop-filter:blur(8px);z-index:5;color:#aaa;font-family:monospace}
  #status .ok{color:#66e0b0}
</style>
</head>
<body>
<div id="stage"></div>
<div id="info">
  <h1>嵐刃・黎恩 Rein</h1>
  <div class="sub">GLB 3D + 紋理剝離 + 完整覆寫</div>
  <p>
    骨架: <code>Soldier.glb</code> (49 骨骼)<br>
    紋理剝離 + 全面重塗: <b>暴風灰藍長風衣</b><br>
    配件: 黑短髮+白挑染、繃帶、披風扣環、耳墜、<br>
    三相之劍「裂空」+ 劍鞘、腰帶、單肩鎧。
  </p>
  <div class="warn">突破: Soldier 的原 1024×1024 紋理已被剝離，<br>讓黎恩配色可完全覆蓋呈現。</div>
</div>
<div id="controls">
  <button id="btn-spin" class="active">⟳ 自動旋轉</button>
  <div style="display:flex;gap:6px;align-items:center;margin-top:4px">
    <button class="el-fire active" data-el="fire">火</button>
    <button class="el-ice" data-el="ice">冰</button>
    <button class="el-thunder" data-el="thunder">雷</button>
  </div>
</div>
<div id="deform-controls" style="position:absolute;right:16px;top:120px;background:rgba(10,14,25,0.85);border:1px solid #4A5A73;border-radius:10px;padding:10px;backdrop-filter:blur(8px);z-index:5;width:240px;font-size:11px;color:#cfddf6">
  <div style="font-weight:bold;margin-bottom:6px;color:#E0A42E">變形參數</div>
  <label>頭部放大 <input id="s-head" type="range" min="1.0" max="1.5" step="0.01" value="1.18" style="width:100%"></label>
  <label>軀幹拉長 <input id="s-spine" type="range" min="1.0" max="1.3" step="0.01" value="1.10" style="width:100%"></label>
  <label>腿部拉長 <input id="s-leg" type="range" min="1.0" max="1.4" step="0.01" value="1.15" style="width:100%"></label>
  <label>腰收縮 <input id="s-waist" type="range" min="0.8" max="1.0" step="0.01" value="0.90" style="width:100%"></label>
  <label style="margin-top:8px;display:block">程序化上色 <input id="t-skin" type="range" min="0" max="1" step="1" value="1" style="width:100%"></label>
</div>
<div id="status">載入中...</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/GLTFLoader.js"></script>

<script>
const C = {
  hair: 0x0D0D1A, hairStreak: 0xE8C888,
  skin: 0xF5C090,   // 明亮暖膚色，ACES下仍顯著
  coat: 0x2050A0, coatInner: 0x0E2040,
  undersuit: 0x080E1E, armor: 0x4060A0, pauldron: 0x152040,
  metal: 0xCCAA44, metalDark: 0x665533, pants: 0x0E1525, boots: 0x080C15,
  fire: 0xE05020, ice: 0x40D0FF, thunder: 0x9050F0,
};

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.85;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e1322);
scene.fog = new THREE.Fog(0x0e1322, 15, 40);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 2.0, 4.5);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.0;
controls.maxDistance = 12;

scene.add(new THREE.HemisphereLight(0x8090cc, 0x1a1030, 0.6));
const keyLight = new THREE.DirectionalLight(0xfff0d0, 1.8);
keyLight.position.set(3, 5, 3);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(0x8899bb, 0.5);
fillLight.position.set(-3, 3, -2);
scene.add(fillLight);
const rimLight = new THREE.DirectionalLight(0xb0c8ff, 0.45);
rimLight.position.set(0, 3, -5);
scene.add(rimLight);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(3.5, 64),
  new THREE.MeshStandardMaterial({ color:0x1a1f2e, roughness:0.85, metalness:0.1 })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

[1.5, 2.5, 3.5].forEach((r, i) => {
  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(r, 0.025, 8, 64),
    new THREE.MeshStandardMaterial({ color:0x3a4358, emissive:0x2a3050, emissiveIntensity:0.3, roughness:0.7, metalness:0.4 })
  );
  ring.rotation.x = Math.PI/2;
  ring.position.y = 0.01 + i*0.005;
  scene.add(ring);
});

let character = null;
let mixer = null;
let animations = [];
let actions = [];
let currentElement = 'fire';
let autoRotate = true;
const accessoryCrys = { fire:null, ice:null, thunder:null };

// 全域變形參數，供 animate loop 每幀套用
let deformParams = {head:1.18, spine:1.10, leg:1.15, waist:0.90};

function deformSkeletonToAnime(root, params = {head:1.18, spine:1.10, leg:1.15, waist:0.90}){
  // 以骨骼名稱做第一性原則變形：7.5頭身、瘦身、收腰、拉長腿
  const baseScales = {
    'mixamorigHips': [params.waist, params.waist, params.waist],
    'mixamorigSpine': [0.92, params.spine*0.96, 0.92],
    'mixamorigSpine1': [params.waist, params.spine, params.waist],
    'mixamorigSpine2': [params.waist*0.98, params.spine*1.02, params.waist*0.98],
    'mixamorigNeck': [0.95, 0.95, 0.95],
    'mixamorigHead': [params.head, params.head, params.head],
    'mixamorigLeftUpLeg': [0.92, params.leg, 0.92],
    'mixamorigRightUpLeg': [0.92, params.leg, 0.92],
    'mixamorigLeftLeg': [0.95, params.leg*0.96, 0.95],
    'mixamorigRightLeg': [0.95, params.leg*0.96, 0.95],
    'mixamorigLeftShoulder': [0.95, 0.95, 0.95],
    'mixamorigRightShoulder': [0.95, 0.95, 0.95],
    'mixamorigLeftArm': [0.92, 0.92, 0.92],
    'mixamorigRightArm': [0.92, 0.92, 0.92],
    'mixamorigLeftForeArm': [0.90, 0.90, 0.90],
    'mixamorigRightForeArm': [0.90, 0.90, 0.90],
  };
  root.traverse(o => {
    if (o.isBone) {
      const key = o.name;
      const s = baseScales[key];
      if (s) {
        o.scale.set(s[0], s[1], s[2]);
      }
    }
  });
  // 額外做一次整體瘦身拉長
  root.scale.set(1, 1.08, 1);
}

new THREE.GLTFLoader().load('models/Soldier.glb', (gltf) => {
  character = gltf.scene;
  animations = gltf.animations || [];
  scene.add(character);

  const box = new THREE.Box3().setFromObject(character);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const scale = 1.0 / Math.max(size.x, size.y, size.z) * 2.4;
  character.scale.setScalar(scale);
  character.position.x -= center.x * scale;
  character.position.y -= box.min.y * scale;
  character.position.y += 0.0 * scale;
  character.position.z -= center.z * scale;

  // ========== 第一性原則變形：以程式算法將軍裝骨架變形為 7.5頭身動漫劍士 ==========
  deformSkeletonToAnime(character);

  // ========== 程序化上色：剝離 Soldier 原紋理，全面套用黎恩配色 ==========
  // 這是第一性原則的算法上色，不走手動建模流程
  let totalMeshes = 0, skinMeshes = 0, coatMeshes = 0;

  function findAllMeshes(obj, list = []) {
    if (obj.isMesh) list.push(obj);
    obj.children.forEach(child => findAllMeshes(child, list));
    return list;
  }

  const allMeshes = findAllMeshes(character);
  allMeshes.forEach(o => {
    if (!o.material) return;
    totalMeshes++;

    const n = (o.name||'').toLowerCase();

    const isSkin = n.includes('visor') || n.includes('face') || n.includes('hand') ||
                   n.includes('finger') || n.includes('ear') || n.includes('neck') ||
                   n.includes('skin') || n.includes('head') || n.includes('eye') ||
                   n.includes('nose') || n.includes('mouth') || n.includes('chin') ||
                   n.includes('forearm') || n.includes('upperarm') || n.includes('thigh') ||
                   n.includes('calf') || n.includes('foot') || n.includes('toe') ||
                   n.includes('vanguard_visor');

    const isBody = n.includes('vanguard_mesh') ||
                   (n.includes('vanguard') && !n.includes('visor'));

    // 判斷配件（三相之劍等）
    const isAccessory = n.includes('ice') || n.includes('thunder') || n.includes('fire') ||
                        n.includes('soul') || n.includes('blade') || n.includes('scabbard') ||
                        n.includes('earring') || n.includes('hair') || n.includes('ribbon') ||
                        n.includes('crystal');

    const mat = Array.isArray(o.material) ? o.material[0] : o.material;
    let color, metalness, roughness;

    if (isSkin) {
      color = C.skin; metalness = 0.0; roughness = 0.65;
    } else if (isAccessory) {
      color = C.metal; metalness = 0.85; roughness = 0.2;
    } else {
      color = C.coat; metalness = 0.02; roughness = 0.8;
    }

    // 完全替換材質（剝離所有貼圖）
    o.material = new THREE.MeshStandardMaterial({
      color: color,
      roughness: roughness,
      metalness: metalness,
    });

    if (isSkin) skinMeshes++;
    else if (isBody) coatMeshes++;
  });

  // 在添加配件後再次統計
  const meshesBeforeAccessories = findAllMeshes(character).length;
  
  if (animations.length > 0) {
    mixer = new THREE.AnimationMixer(character);
    animations.forEach((clip, i) => {
      actions[i] = mixer.clipAction(clip);
      actions[i].setLoop(THREE.LoopRepeat);
    });
    actions[0].play();
  }

  addReinAccessories(character);
  
  const meshesAfterAccessories = findAllMeshes(character).length;
  console.log(`Meshes before accessories: ${meshesBeforeAccessories}, after: ${meshesAfterAccessories}`);

  let bones = 0;
  character.traverse(o => { if (o.isBone) bones++; });

  setStatus(`✓ 渲染成功 — ${bones} 骨骼 / ${animations.length} 動畫 / 程序化上色已套用 / ${meshesAfterAccessories} mesh / 黎恩配色`);
  setupUI();
}, undefined, (err) => {
  setStatus('❌ 載入失敗: ' + (err.message||err), true);
});

function findBone(root, name) {
  let found = null;
  root.traverse(o => {
    if (o.isBone && o.name.toLowerCase().includes(name.toLowerCase())) found = o;
  });
  return found;
}

function addReinAccessories(root) {
  const head          = findBone(root, 'head');
  const neck          = findBone(root, 'neck');
  const spine         = findBone(root, 'spine');
  const spine1        = findBone(root, 'spine1');
  const leftHand      = findBone(root, 'leftHand');
  const rightForeArm  = findBone(root, 'rightForeArm');
  const rightShoulder = findBone(root, 'rightShoulder');
  const leftShoulder  = findBone(root, 'leftShoulder');
  const rightUpLeg    = findBone(root, 'rightUpLeg');
  const leftFoot      = findBone(root, 'leftFoot');
  const rightFoot     = findBone(root, 'rightFoot');

  // === 1. 黑短髮 + 電光白挑染 ===
  if (head) {
    // 整體髮殼（球體大半部）
    const hairShell = new THREE.Mesh(
      new THREE.SphereGeometry(0.21, 32, 24),
      new THREE.MeshStandardMaterial({ color:C.hair, roughness:0.9 })
    );
    hairShell.position.set(0, 0.05, -0.02);
    hairShell.scale.set(1.25, 1.25, 1.25);
    hairShell.renderOrder = 10;
    head.add(hairShell);

    // 瀏海（多束分層）
    for (let i=-2; i<=2; i++){
      const bang = new THREE.Mesh(
        new THREE.BoxGeometry(0.07, 0.12, 0.03),
        new THREE.MeshStandardMaterial({ color:C.hair, roughness:0.9 })
      );
      bang.position.set(i*0.05, 0.02, 0.14);
      bang.rotation.z = i*0.08;
      head.add(bang);
    }

    // 後腦短髮（向後突出）
    const hairBack = new THREE.Mesh(
      new THREE.SphereGeometry(0.14, 20, 14, 0, Math.PI*2, 0, Math.PI*0.55),
      new THREE.MeshStandardMaterial({ color:C.hair, roughness:0.9 })
    );
    hairBack.position.set(0, 0.0, -0.10);
    hairBack.scale.set(1.0, 0.9, 0.8);
    head.add(hairBack);

    // 右側蓬鬆髮塊
    const hairR = new THREE.Mesh(
      new THREE.SphereGeometry(0.12, 16, 14),
      new THREE.MeshStandardMaterial({ color:C.hair, roughness:0.9 })
    );
    hairR.position.set(-0.16, 0.04, 0);
    hairR.scale.set(1.0, 1.1, 0.9);
    head.add(hairR);
    const hairL = new THREE.Mesh(
      new THREE.SphereGeometry(0.11, 16, 14),
      new THREE.MeshStandardMaterial({ color:C.hair, roughness:0.9 })
    );
    hairL.position.set(0.15, 0.04, -0.01);
    head.add(hairL);

    // 電光白挑染（立繪明確顯示左上+右上兩處大塊）
    const streakBig1 = new THREE.Mesh(
      new THREE.SphereGeometry(0.08, 14, 12),
      new THREE.MeshStandardMaterial({ color:C.hairStreak, roughness:0.7, emissive:C.hairStreak, emissiveIntensity:0.7 })
    );
    streakBig1.position.set(0.05, 0.07, 0.11);
    streakBig1.scale.set(1.4, 1.1, 0.7);
    head.add(streakBig1);
    const streakBig2 = new THREE.Mesh(
      new THREE.SphereGeometry(0.06, 12, 10),
      new THREE.MeshStandardMaterial({ color:C.hairStreak, roughness:0.7, emissive:C.hairStreak, emissiveIntensity:0.5 })
    );
    streakBig2.position.set(0.13, 0.05, 0.05);
    head.add(streakBig2);
  }

  // === 2. 異色瞳（左金右冰藍） ===
  if (head) {
    const eyeR = new THREE.Mesh(
      new THREE.SphereGeometry(0.028, 12, 10),
      new THREE.MeshStandardMaterial({ color:0xE0A42E, emissive:0xE0A42E, emissiveIntensity:0.7, roughness:0.15 })
    );
    eyeR.position.set(-0.07, 0.0, 0.16);
    head.add(eyeR);
    const eyeL = new THREE.Mesh(
      new THREE.SphereGeometry(0.028, 12, 10),
      new THREE.MeshStandardMaterial({ color:0x6FC7E8, emissive:0x6FC7E8, emissiveIntensity:0.7, roughness:0.15 })
    );
    eyeL.position.set(0.07, 0.0, 0.16);
    head.add(eyeL);

    // 眉毛
    const browR = new THREE.Mesh(
      new THREE.BoxGeometry(0.05, 0.008, 0.008),
      new THREE.MeshStandardMaterial({ color:0x1F2538, roughness:0.8 })
    );
    browR.position.set(-0.07, 0.04, 0.16);
    browR.rotation.z = -0.15;
    head.add(browR);
    const browL = browR.clone();
    browL.position.x = 0.07;
    browL.rotation.z = 0.15;
    head.add(browL);
  }

  // === 3. 左耳電光石耳墜 ===
  if (head) {
    const earRingGroup = new THREE.Group();
    earRingGroup.position.set(0.17, -0.02, 0.02);
    const gem = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.05),
      new THREE.MeshStandardMaterial({ color:0xC8A8FF, emissive:0xC8A8FF, emissiveIntensity:1.8, roughness:0.1, metalness:0.7 })
    );
    gem.position.y = -0.20;
    earRingGroup.add(gem);
    const chain = new THREE.Mesh(
      new THREE.CylinderGeometry(0.005, 0.005, 0.12, 8),
      new THREE.MeshStandardMaterial({ color:C.metal, metalness:0.95, roughness:0.2 })
    );
    chain.position.y = -0.12;
    earRingGroup.add(chain);
    head.add(earRingGroup);
  }

  // === 4. 高領緊身衣（黑色立領） ===
  if (neck) {
    const collar = new THREE.Mesh(
      new THREE.CylinderGeometry(0.10, 0.12, 0.10, 16),
      new THREE.MeshStandardMaterial({ color:C.undersuit, roughness:0.55 })
    );
    collar.position.y = 0.04;
    neck.add(collar);
  }

  // === 5. 護胸甲 + 胸側三條發光條紋 ===
  if (spine1) {
    const chestArmor = new THREE.Mesh(
      new THREE.BoxGeometry(0.32, 0.35, 0.10),
      new THREE.MeshStandardMaterial({ color:C.armor, roughness:0.4, metalness:0.7 })
    );
    chestArmor.position.set(0, 0.15, 0.10);
    spine1.add(chestArmor);

    // 金屬邊框
    const armorEdge1 = new THREE.Mesh(
      new THREE.BoxGeometry(0.34, 0.015, 0.12),
      new THREE.MeshStandardMaterial({ color:C.metal, metalness:0.95, roughness:0.2 })
    );
    armorEdge1.position.set(0, 0.34, 0.10);
    spine1.add(armorEdge1);
    const armorEdge2 = armorEdge1.clone();
    armorEdge2.position.y = -0.04;
    spine1.add(armorEdge2);
    const armorEdge3 = new THREE.Mesh(
      new THREE.BoxGeometry(0.015, 0.38, 0.12),
      new THREE.MeshStandardMaterial({ color:C.metal, metalness:0.95, roughness:0.2 })
    );
    armorEdge3.position.set(0, 0.15, 0.10);
    spine1.add(armorEdge3);

    // 中央十字稜線
    const armorLineH = new THREE.Mesh(
      new THREE.BoxGeometry(0.32, 0.008, 0.13),
      new THREE.MeshStandardMaterial({ color:C.metalDark, metalness:0.8, roughness:0.3 })
    );
    armorLineH.position.set(0, 0.15, 0.13);
    spine1.add(armorLineH);

    // **胸側三條發光條紋**（赤藍紫）
    [-0.16, -0.10, -0.04].forEach((x, i) => {
      const stripe = new THREE.Mesh(
        new THREE.BoxGeometry(0.012, 0.25, 0.008),
        new THREE.MeshStandardMaterial({
          color:[C.fire, C.ice, C.thunder][i],
          emissive:[C.fire, C.ice, C.thunder][i],
          emissiveIntensity:2.0,
        })
      );
      stripe.position.set(x, 0.15, 0.16);
      spine1.add(stripe);
    });
  }

  // === 6. 暴風灰藍長風衣（內襯深紫） ===
  if (spine) {
    // 風衣主體（兩片敞開）
    const coatLeft = new THREE.Mesh(
      new THREE.BoxGeometry(0.18, 0.95, 0.12),
      new THREE.MeshStandardMaterial({ color:C.coat, roughness:0.75, side:THREE.DoubleSide })
    );
    coatLeft.position.set(-0.15, -0.15, 0.07);
    coatLeft.rotation.z = 0.05;
    spine.add(coatLeft);

    const coatRight = coatLeft.clone();
    coatRight.position.x = 0.15;
    coatRight.rotation.z = -0.05;
    spine.add(coatRight);

    // 後片
    const coatBack = new THREE.Mesh(
      new THREE.BoxGeometry(0.35, 1.00, 0.14),
      new THREE.MeshStandardMaterial({ color:C.coat, roughness:0.75, side:THREE.DoubleSide })
    );
    coatBack.position.set(0, -0.15, -0.05);
    spine.add(coatBack);

    // 內襯（深紫）
    const coatInner = new THREE.Mesh(
      new THREE.BoxGeometry(0.22, 0.90, 0.05),
      new THREE.MeshStandardMaterial({ color:C.coatInner, roughness:0.6, side:THREE.DoubleSide })
    );
    coatInner.position.set(0, -0.20, 0.10);
    spine.add(coatInner);

    // 風衣下擺外展
    const coatSkirt = new THREE.Mesh(
      new THREE.CylinderGeometry(0.46, 0.22, 0.55, 16, 1, true),
      new THREE.MeshStandardMaterial({ color:C.coat, roughness:0.75, side:THREE.DoubleSide })
    );
    coatSkirt.position.set(0, -0.70, 0);
    spine.add(coatSkirt);

    const coatSkirtInner = new THREE.Mesh(
      new THREE.CylinderGeometry(0.44, 0.20, 0.52, 16, 1, true),
      new THREE.MeshStandardMaterial({ color:C.coatInner, roughness:0.6, side:THREE.BackSide })
    );
    coatSkirtInner.position.set(0, -0.70, 0);
    spine.add(coatSkirtInner);

    // 翻領（兩片高至下巴）
    const lapelLeft = new THREE.Mesh(
      new THREE.BoxGeometry(0.13, 0.30, 0.04),
      new THREE.MeshStandardMaterial({ color:C.coat, roughness:0.75 })
    );
    lapelLeft.position.set(-0.10, 0.45, 0.10);
    lapelLeft.rotation.z = 0.15;
    spine.add(lapelLeft);
    const lapelRight = lapelLeft.clone();
    lapelRight.position.x = 0.10;
    lapelRight.rotation.z = -0.15;
    spine.add(lapelRight);
  }

  // === 7. 右袖雷紋刺繡 ===
  if (rightForeArm) {
    const sleeveEmblem = new THREE.Mesh(
      new THREE.TorusGeometry(0.085, 0.010, 8, 24, Math.PI*1.5),
      new THREE.MeshStandardMaterial({ color:C.thunder, emissive:C.thunder, emissiveIntensity:2.0 })
    );
    sleeveEmblem.position.y = -0.20;
    sleeveEmblem.rotation.x = Math.PI/2;
    sleeveEmblem.rotation.y = -0.3;
    rightForeArm.add(sleeveEmblem);
  }

  // === 8. 右手纏繃帶封印雷元素 ===
  if (rightForeArm) {
    const bandageMat = new THREE.MeshStandardMaterial({ color:0xF0E8D8, roughness:0.85 });
    const bandageMain = new THREE.Mesh(
      new THREE.CylinderGeometry(0.088, 0.075, 0.32, 12),
      bandageMat
    );
    bandageMain.position.y = -0.14;
    rightForeArm.add(bandageMain);
    for (let i=0;i<10;i++){
      const wrap = new THREE.Mesh(
        new THREE.TorusGeometry(0.090, 0.014, 6, 16),
        bandageMat
      );
      wrap.position.y = -0.27 + i*0.028;
      wrap.rotation.x = Math.PI/2;
      rightForeArm.add(wrap);
    }
    const bandageStrip = new THREE.Mesh(
      new THREE.BoxGeometry(0.030, 0.13, 0.005),
      bandageMat
    );
    bandageStrip.position.set(0, -0.38, 0.025);
    bandageStrip.rotation.x = -0.3;
    rightForeArm.add(bandageStrip);
  }

  // === 9. 右肩單片鎧（黑鎧） ===
  if (rightShoulder) {
    const pauldronGroup = new THREE.Group();
    pauldronGroup.position.set(0.02, 0.05, 0);
    const pauldronMain = new THREE.Mesh(
      new THREE.SphereGeometry(0.22, 22, 18, 0, Math.PI*2, 0, Math.PI*0.55),
      new THREE.MeshStandardMaterial({ color:C.pauldron, roughness:0.3, metalness:0.8 })
    );
    pauldronGroup.add(pauldronMain);
    const rim = new THREE.Mesh(
      new THREE.TorusGeometry(0.20, 0.016, 8, 24, Math.PI*1.1),
      new THREE.MeshStandardMaterial({ color:C.metal, metalness:0.95, roughness:0.15 })
    );
    rim.rotation.x = -Math.PI/2;
    rim.rotation.z = -Math.PI*0.3;
    pauldronGroup.add(rim);
    const spike = new THREE.Mesh(
      new THREE.ConeGeometry(0.05, 0.16, 8),
      new THREE.MeshStandardMaterial({ color:C.metal, metalness:0.95, roughness:0.15 })
    );
    spike.position.set(-0.10, 0.10, -0.02);
    spike.rotation.z = 0.3;
    pauldronGroup.add(spike);
    rightShoulder.add(pauldronGroup);
  }

  // === 10. 左肩披風扣環（金屬圓環 + 三段布帶） ===
  if (leftShoulder) {
    const capeClaspGroup = new THREE.Group();
    capeClaspGroup.position.set(0.0, 0.18, 0);
    const claspRing = new THREE.Mesh(
      new THREE.TorusGeometry(0.06, 0.014, 8, 16),
      new THREE.MeshStandardMaterial({ color:C.metal, metalness:0.95, roughness:0.2 })
    );
    claspRing.rotation.y = Math.PI/2;
    capeClaspGroup.add(claspRing);
    for (let i=0;i<3;i++){
      const strip = new THREE.Mesh(
        new THREE.BoxGeometry(0.014, 0.22, 0.014),
        new THREE.MeshStandardMaterial({ color:C.coatInner, roughness:0.8 })
      );
      strip.position.set(0, -0.12, i*0.04 - 0.04);
      capeClaspGroup.add(strip);
    }
    leftShoulder.add(capeClaspGroup);
  }

  // === 11. 腰帶 + 金扣 ===
  if (spine) {
    const belt = new THREE.Mesh(
      new THREE.TorusGeometry(0.22, 0.028, 12, 32),
      new THREE.MeshStandardMaterial({ color:0x14171C, roughness:0.5, metalness:0.4 })
    );
    belt.position.set(0, -0.60, 0.06);
    belt.rotation.x = Math.PI/2;
    spine.add(belt);
    const beltBuckle = new THREE.Mesh(
      new THREE.BoxGeometry(0.10, 0.07, 0.025),
      new THREE.MeshStandardMaterial({ color:C.metal, metalness:0.95, roughness:0.2 })
    );
    beltBuckle.position.set(0, -0.60, 0.20);
    spine.add(beltBuckle);
  }

  // === 12. 劍鞘（腰後右側，25° 斜角） ===
  if (rightUpLeg) {
    const scabbardGroup = new THREE.Group();
    scabbardGroup.position.set(0.15, -0.30, -0.10);
    scabbardGroup.rotation.z = Math.PI/180 * 25;
    scabbardGroup.rotation.x = 0.15;
    const scabbardBlade = new THREE.Mesh(
      new THREE.BoxGeometry(0.06, 1.05, 0.04),
      new THREE.MeshStandardMaterial({ color:0x1B1E24, roughness:0.3, metalness:0.7 })
    );
    scabbardBlade.position.y = -0.36;
    scabbardGroup.add(scabbardBlade);
    const scabbardMouth = new THREE.Mesh(
      new THREE.CylinderGeometry(0.05, 0.05, 0.04, 12),
      new THREE.MeshStandardMaterial({ color:C.metal, metalness:0.95, roughness:0.2 })
    );
    scabbardMouth.position.y = 0.16;
    scabbardGroup.add(scabbardMouth);
    const scabbardTip = new THREE.Mesh(
      new THREE.ConeGeometry(0.035, 0.08, 12),
      new THREE.MeshStandardMaterial({ color:C.metal, metalness:0.95, roughness:0.2 })
    );
    scabbardTip.position.y = -0.82;
    scabbardGroup.add(scabbardTip);
    const magnetClasp = new THREE.Mesh(
      new THREE.BoxGeometry(0.04, 0.025, 0.012),
      new THREE.MeshStandardMaterial({ color:C.metal, metalness:0.95, roughness:0.15 })
    );
    magnetClasp.position.set(0, 0.02, 0.025);
    scabbardGroup.add(magnetClasp);
    rightUpLeg.add(scabbardGroup);
  }

  // === 13. 三相之劍「裂空」（左手持握，劍尖朝下觸地） ===
  if (leftHand) {
    const swordGroup = new THREE.Group();
    swordGroup.position.set(0, -0.15, 0.05);
    swordGroup.rotation.x = Math.PI;

    const bladeLen = 1.4;
    const blade = new THREE.Mesh(
      new THREE.BoxGeometry(0.04, bladeLen, 0.012),
      new THREE.MeshStandardMaterial({ color:0xC8D0D8, roughness:0.15, metalness:0.95 })
    );
    blade.position.y = -bladeLen/2 - 0.06;
    swordGroup.add(blade);

    const crossguard = new THREE.Mesh(
      new THREE.BoxGeometry(0.22, 0.04, 0.05),
      new THREE.MeshStandardMaterial({ color:C.metal, metalness:0.95, roughness:0.2 })
    );
    crossguard.position.y = -0.06;
    swordGroup.add(crossguard);

    // **三枚碎晶（赤藍紫）**
    accessoryCrys.fire = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.025),
      new THREE.MeshStandardMaterial({ color:C.fire, emissive:C.fire, emissiveIntensity:2.5 })
    );
    accessoryCrys.fire.position.set(-0.06, -0.06, 0.03);
    swordGroup.add(accessoryCrys.fire);
    accessoryCrys.ice = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.025),
      new THREE.MeshStandardMaterial({ color:C.ice, emissive:C.ice, emissiveIntensity:2.5 })
    );
    accessoryCrys.ice.position.set(0, -0.06, 0.03);
    swordGroup.add(accessoryCrys.ice);
    accessoryCrys.thunder = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.025),
      new THREE.MeshStandardMaterial({ color:C.thunder, emissive:C.thunder, emissiveIntensity:2.5 })
    );
    accessoryCrys.thunder.position.set(0.06, -0.06, 0.03);
    swordGroup.add(accessoryCrys.thunder);

    const grip = new THREE.Mesh(
      new THREE.CylinderGeometry(0.025, 0.025, 0.22, 12),
      new THREE.MeshStandardMaterial({ color:0x14171C, roughness:0.4 })
    );
    grip.position.y = 0.12;
    swordGroup.add(grip);

    const pommel = new THREE.Mesh(
      new THREE.SphereGeometry(0.04, 12, 10),
      new THREE.MeshStandardMaterial({ color:C.metal, metalness:0.95, roughness:0.2 })
    );
    pommel.position.y = 0.28;
    swordGroup.add(pommel);

    leftHand.add(swordGroup);
  }

  // === 14. 戰鬥靴（金屬鞋頭） ===
  if (leftFoot && rightFoot) {
    [leftFoot, rightFoot].forEach(foot => {
      const boot = new THREE.Mesh(
        new THREE.BoxGeometry(0.12, 0.10, 0.18),
        new THREE.MeshStandardMaterial({ color:C.boots, roughness:0.5 })
      );
      boot.position.set(0, 0.05, 0.08);
      foot.add(boot);
      const bootTip = new THREE.Mesh(
        new THREE.BoxGeometry(0.13, 0.04, 0.20),
        new THREE.MeshStandardMaterial({ color:C.metal, metalness:0.95, roughness:0.2 })
      );
      bootTip.position.set(0, 0.03, 0.08);
      foot.add(bootTip);
    });
  }
}

function setStatus(msg) {
  document.getElementById('status').innerHTML = msg;
}
function setElement(el) {
  currentElement = el;
  [accessoryCrys.fire, accessoryCrys.ice, accessoryCrys.thunder].forEach(c => {
    if (c) c.material.emissiveIntensity = 0.8;
  });
  if (accessoryCrys[el]) accessoryCrys[el].material.emissiveIntensity = 4.0;
  document.querySelectorAll('.el-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-el="${el}"]`)?.classList.add('active');
}
function setupUI() {
  document.getElementById('btn-spin').addEventListener('click', () => {
    autoRotate = !autoRotate;
    document.getElementById('btn-spin').classList.toggle('active', autoRotate);
  });
  document.querySelectorAll('[data-el]').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('[data-el]').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      // element switch logic can be added
    });
  });
  // 變形拉桿
  const sHead = document.getElementById('s-head');
  const sSpine = document.getElementById('s-spine');
  const sLeg = document.getElementById('s-leg');
  const sWaist = document.getElementById('s-waist');
  const tSkin = document.getElementById('t-skin');
  const updateDeform = () => {
    if (!character) return;
    deformParams = {
      head: parseFloat(sHead.value),
      spine: parseFloat(sSpine.value),
      leg: parseFloat(sLeg.value),
      waist: parseFloat(sWaist.value)
    };
    // 即時套用一次（下一幀 animate 會持續維持）
    deformSkeletonToAnime(character, deformParams);
  // 程序化皮膚上色強度（0=保留貼圖原色，1=完全程序化上色）
    const t = parseFloat(tSkin.value);
    if (character) {
      character.traverse(o => {
        if (!o.isMesh) return;
        const n = (o.name||'').toLowerCase();
        const isSkin = n.includes('visor') || n.includes('face') || n.includes('hand') ||
                       n.includes('neck') || n.includes('skin') || n.includes('head') ||
                       n.includes('vanguard_visor');
        const isBody = n.includes('vanguard_mesh') || (n.includes('vanguard') && !n.includes('visor'));
        if (!isSkin && !isBody) return;
        const color = isSkin ? C.skin : C.coat;
        const rough = isSkin ? 0.65 : 0.8;
        const metal = isSkin ? 0.0 : 0.02;
        o.material.color.set(color);
        o.material.roughness = rough;
        o.material.metalness = metal;
        // 剝離貼圖確保顏色純正
        if (t > 0.5) {
          o.material.map = null;
          o.material.normalMap = null;
          o.material.roughnessMap = null;
          o.material.metalnessMap = null;
        }
        o.material.needsUpdate = true;
      });
    }
  };
  [sHead, sSpine, sLeg, sWaist, tSkin].forEach(el => el && el.addEventListener('input', updateDeform));
  updateDeform();
}

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  if (autoRotate && character) character.rotation.y += dt * 0.4;
  if (mixer) mixer.update(dt);
  // 每幀在 mixer 之後重新套用骨骼變形，防止動畫覆蓋
  if (character) deformSkeletonToAnime(character, deformParams);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
